[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xdev-tp-torch"
version = "0.1.0"
description = "Strict Tensor bridge for admitted xdev TP endpoints"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0"]

[tool.setuptools]
packages = ["xdev_tp_torch"]
