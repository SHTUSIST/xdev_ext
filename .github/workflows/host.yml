name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y libbpf-dev libelf-dev zlib1g-dev pkg-config clang llvm redis-server
      - name: Standalone production-rule checks
        run: python3 scripts/test_host.py
      - name: CPU mechanism BPF target and scratch ABI contracts
        run: make -C kernel/tools/xdev_ext_mech check-cpu-bpf
      - name: Tool accounting, buffer bounds and SGL profile contracts
        run: |
          python3 kernel/tools/testing/selftests/xdev_ext_mech_tools/xdev_ext_mech_reliable_accounting_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech_tools/xdev_ext_unified_demo_read_test.py
          python3 kernel/tools/testing/selftests/nvme_xdev_ext_passthru/nvme_sgl_profile_test.py
      - name: Reference-counted lifecycle and CPU transform contracts
        run: python3 kernel/tools/testing/selftests/xdev_ext_mech/refs_suite.py
      - name: Native lifecycle scheduler and teardown contracts
        run: |
          python3 kernel/tools/testing/selftests/xdev_ext_mech/fanout_scheduler/run.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/fanout_scheduler/produced_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/fanout_scheduler/recycle_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/guest_harness_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/recycle_input_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/teardown_checked/test_ce_unbind.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/provider/unbind_api_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/provider/faults/run.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/provider/stats_frames_test.py
      - name: Socket NIC copy fallback and accounting contracts
        shell: bash
        run: |
          set -euo pipefail
          tests="kernel/tools/testing/selftests/xdev_ext_mech"
          for t in adapter_test independent_credentials rx_adapter_test rx_create_check_test produced_trim_test produced_core_test bpf_both_directions_test nic_accounting_test nic_fallback_choice_test ctl_socket_test rx_core_fifo_test; do
            python3 "$tests/socket_sink/$t.py"
          done
          make -C "$tests/socket_guest" check
      - name: Concurrent frontend workload and evidence checks
        run: python3 kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_concurrency_test.py
      - name: Frontend fork ownership and publication windows
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # These source-extraction tests require this checked-out source tree.
          tests="kernel/tools/testing/selftests/xdev_ext_preload"
          log="$RUNNER_TEMP/xdev-ext-frontend-fork.log"
          timeout 180 python3 "$tests/independent_ordinary_fork_lifetime.py" 2>&1 | tee "$log"
          timeout 60 python3 "$tests/independent_mech_fork_inherited.py" 2>&1 | tee -a "$log"
          timeout 60 python3 "$tests/independent_mech_fork_teardown.py" 2>&1 | tee -a "$log"
          if grep -Eiq '(^not ok([[:space:]]|$)|#[[:space:]]*SKIP([[:space:]]|$)|OK[[:space:]]+\(skipped=|\.\.\. skipped)' "$log"; then
            echo "Frontend fork checks reported failed or skipped cases"
            exit 1
          fi
          test "$(grep -c '^ok [0-9][0-9]* - ' "$log")" -eq 13
          test "$(grep -c '^ok - actual ' "$log")" -eq 2
      - name: Frontend invalid-memory semantics
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/tests/eval/apps/build"
          log="$RUNNER_TEMP/xdev-ext-frontend-invalid-memory.log"
          make -C tests/eval/apps \
            build/libio_uring_unified.so build/libxdev_ext_preload_kernel_model.so
          XDEV_EXT_PRELOAD_TEST_DIR="$output" timeout 300 python3 \
            kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_efault_test.py 2>&1 | tee "$log"
          timeout 300 python3 \
            kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_positional_efault_test.py \
            --build-dir "$output" \
            --results "$RUNNER_TEMP/xdev-ext-positional-fault.json" 2>&1 | tee -a "$log"
          timeout 300 python3 \
            kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_payload_integrity_test.py 2>&1 | tee -a "$log"
          for t in socket_mech_table fallback_report fd_footprint; do
            XDEV_EXT_PRELOAD_TEST_DIR="$output" timeout 300 python3 \
              kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_${t}_test.py 2>&1 | tee -a "$log"
          done
          if grep -Eiq '^(not ok[[:space:]]|ok[[:space:]].*#[[:space:]]*SKIP|OK[[:space:]]+\(skipped=)|\.\.\. skipped' "$log"; then
            echo "Frontend invalid-memory checks reported failed or skipped cases"
            exit 1
          fi
      - name: Portable comparison workloads and frontend call shapes
        run: |
          make -C tests/eval check
          python3 tests/eval/run.py --suite portable
          make -C tests/eval/apps check
      # SDK-dependent build checks skip explicitly on this SDK-free runner;
      # CLI, refusal and result contracts still run.
      - name: Migrated Redis fragmented response correctness
        run: make -C tests/eval redis-fragmented-check
      - name: GDS CLI and capability contracts
        run: python3 tests/eval/gds/test_gds.py -v
      - name: HFT-shaped replay correctness and ownership
        run: make -C tests/eval hft-check
      - name: Registered-host compute offline contracts
        shell: bash
        run: |
          set -euo pipefail
          case "$CC" in
            gcc) export CXX=g++ ;;
            clang) export CXX=clang++ ;;
            *) exit 1 ;;
          esac
          make -C tests/eval cuda-host-check
      - name: Reviewer-driven evaluation harness contracts
        run: make -C tests/eval reviewer-eval-check
      - name: Native-view evidence, trace and dma-fence contracts
        run: make -C tests/eval native-eval-check
      - name: Eval session image and run-only wiring contracts
        run: python3 kernel/tools/testing/selftests/xdev_ext_integration/xdev_ext_eval_session_harness_test.py -v
      - name: IAA syscall and lifetime contracts
        run: make -C tests/iaa all check
      - name: GPU host-page bookkeeping contracts
        run: make -C gpu/tests run-host-bookkeeping
      - name: GPU callback, DMA mapping and frame ownership contracts
        run: |
          python3 scripts/prepare_sources.py --component nvidia
          make -C gpu/tests run-lifecycle-contract
      - name: Reliable control admission and map teardown regressions
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xdev-ext-reliable-regressions.log"
          python3 kernel/tools/testing/selftests/xdev_ext_mech/reliable/regressions/control_stop_admission_test.py 2>&1 | tee "$log"
          python3 kernel/tools/testing/selftests/xdev_ext_mech/reliable/regressions/native_done_map_teardown_test.py 2>&1 | tee -a "$log"
          sh kernel/tools/testing/selftests/xdev_ext_mech/reliable/slow_downstream_run.sh 2>&1 | tee -a "$log"
          for t in downstream_failure_terminal held_reply_provider single_crc_pass backpressure_skip_payload; do
            python3 kernel/tools/testing/selftests/xdev_ext_mech/reliable/regressions/${t}_test.py 2>&1 | tee -a "$log"
          done
          python3 kernel/tools/testing/selftests/xdev_ext_mech/transport_pending/transport_counters_test.py 2>&1 | tee -a "$log"
          if grep -Eiq '^(not ok[[:space:]]|ok[[:space:]].*#[[:space:]]*SKIP|OK[[:space:]]+\(skipped=)|\.\.\. skipped' "$log"; then
            echo "Reliable regressions reported failed or skipped cases"
            exit 1
          fi
      - name: Reliable BPF protocol and immutable policy contracts
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xdev-ext-reliable-policy.log"
          XDEV_EXT_LIBBPF_INCLUDE=/usr/include make -C kernel/tools/testing/selftests/xdev_ext_mech/reliable/bpf_glue check 2>&1 | tee "$log"
          make -C kernel/tools/testing/selftests/xdev_ext_policy check 2>&1 | tee -a "$log"
          if grep -Eiq '^(not ok[[:space:]]|ok[[:space:]].*#[[:space:]]*SKIP|OK[[:space:]]+\(skipped=)|\.\.\. skipped' "$log"; then
            echo "Reliable protocol or policy checks reported failed or skipped cases"
            exit 1
          fi
      - name: Source layout and preparation regressions
        if: matrix.cc == 'gcc'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mechanism source contracts
        if: matrix.cc == 'gcc'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xdev-ext-mechanism-source.log"
          python3 kernel/tools/testing/selftests/xdev_ext_mech/xdev_ext_mech_source_test.py 2>&1 | tee "$log"
          python3 kernel/tools/testing/selftests/xdev_ext_mech/xdev_ext_mech_ce_source_test.py 2>&1 | tee -a "$log"
          python3 kernel/tools/testing/selftests/xdev_ext_mech/independent_ce_lease.py 2>&1 | tee -a "$log"
          for t in teardown stop_work_rearm start_keys frames_release transform_alias alias_table stage_get_cmd; do
            python3 kernel/tools/testing/selftests/xdev_ext_mech/core_lifecycle/${t}_test.py 2>&1 | tee -a "$log"
          done
          sh kernel/tools/testing/selftests/xdev_ext_mech/iaa_transform/run.sh 2>&1 | tee -a "$log"
          python3 kernel/tools/testing/selftests/bpf/xdev_ext_hardening_source_test.py 2>&1 | tee -a "$log"
          python3 kernel/tools/testing/selftests/xdev_ext_sendpath_baseline/pick_send_path_test.py 2>&1 | tee -a "$log"
          if grep -Eiq '^(not ok[[:space:]]|ok[[:space:]].*#[[:space:]]*SKIP|OK[[:space:]]+\(skipped=)' "$log"; then
            echo "Mechanism source checks reported failed or skipped cases"
            exit 1
          fi
      - name: Peer control and lifetime checks
        if: matrix.cc == 'gcc'
        run: make -C kernel/tools/testing/selftests/xdev_ext_peer run_tests
      - name: Native peer teardown, owner and profile contracts
        if: matrix.cc == 'gcc'
        run: |
          python3 kernel/tools/testing/selftests/xdev_ext_mech/peer_graph/test_native_teardown.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/peer_graph/test_native_owner_teardown.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/peer_graph/test_native_admission_profile.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/peer_graph/test_native_rep_rx.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/peer_graph/mlx5_peer_rx_ring_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/peer_graph/independent_mlx5_peer_lifecycle.py
      - name: Fence guest evidence rejection controls
        run: python3 kernel/tools/testing/selftests/xdev_ext_integration/xdev_ext_fence_validate_test.py -v
      - name: Integration harness and verdict checks
        if: matrix.cc == 'gcc'
        run: python3 -m unittest discover -s kernel/tools/testing/selftests/xdev_ext_integration -p '*_test.py' -v
      - name: GPU source and fence checks
        if: matrix.cc == 'gcc'
        run: |
          python3 gpu/tests/nv_xdev_ext_gpu_source_test.py
          python3 gpu/tests/nv_xdev_ext_ce_async_source_test.py
          python3 gpu/tests/nv_xdev_ext_ce_fence_algorithm_test.py
