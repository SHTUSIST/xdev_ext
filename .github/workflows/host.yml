name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc]
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        working-directory: build/source-view
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host test dependencies
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libbpf-dev libelf-dev zlib1g-dev pkg-config clang llvm redis-server
      - name: Materialize isolated logical source inputs
        working-directory: .
        run: |
          python3 tools/layout.py view
          echo "XDEV_EXT_CANONICAL_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "XDEV_EXT_SOURCE_VIEW=$GITHUB_WORKSPACE/build/source-view" >> "$GITHUB_ENV"
      - name: Kernel switch planning, recovery boundaries and bare-metal bring-up
        working-directory: .
        run: python3 -m unittest discover -s tests/integration/boot -p 'test_*.py' -v
      - name: TP host algorithms and native custody contracts
        working-directory: .
        run: python3 tests/compute/tp/native_suite.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/tp-native-contracts"
      - name: TP framework and measurement software contracts
        working-directory: .
        run: |
          python3 -m unittest discover -s tests/compute/tp/framework -p 'test_*.py' -v
          python3 -m unittest discover -s tests/compute/tp/eval -p 'test_*.py' -v
          python3 tests/compute/tp/echo_boundary_test.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/tp-echo-contracts"
          python3 tests/compute/tp/echo_gpu_boundary_test.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/tp-echo-gpu-contracts"
          python3 tests/compute/cuda/early_selection/test_selection.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/cuda-early-owner-contracts"
          python3 tests/compute/cuda/early_selection/test_driver.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/tp-early-selection-contracts"
          python3 tests/compute/tp/echo_gpu_mutations_test.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/tp-echo-gpu-mutations"
      - name: NVIDIA dma-buf descriptor and module ownership
        working-directory: .
        run: python3 -I tests/compute/nvidia/nv_xdev_ext_dmabuf_test.py
      - name: Declarative class rules and independent extension rows
        working-directory: .
        run: bash tests/core/class_declarations/run.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/class-declarations" candidate all block-v2
      - name: Standalone production-rule checks
        run: python3 "$GITHUB_WORKSPACE/tools/ci/test_host.py"
      - name: CE residual exclusion and retained cleanup ownership
        working-directory: .
        run: |
          python3 tests/compute/ce_residual/run.py --source-root "$GITHUB_WORKSPACE" --phase repaired --output "$RUNNER_TEMP/ce-residual"
          python3 tests/compute/ce_residual/run_supplement.py --base-evidence "$RUNNER_TEMP/ce-residual" --output "$RUNNER_TEMP/ce-residual-multistage"
          python3 tests/compute/ce_residual/run_nonconflict.py --base-evidence "$RUNNER_TEMP/ce-residual" --output "$RUNNER_TEMP/ce-residual-nonconflict"
          python3 tests/compute/ce_residual/run_mutants.py --base-evidence "$RUNNER_TEMP/ce-residual" --output "$RUNNER_TEMP/ce-residual-mutants"
      - name: Shared CE and DMA lease ownership
        working-directory: .
        run: python3 tests/compute/family/lease/run.py --source-root "$GITHUB_WORKSPACE" --phase shared-mutations --out "$RUNNER_TEMP/compute-shared-lease"
      - name: CE random target rules and native runner oracle contracts
        working-directory: .
        run: make ce-random-check
      - name: CPU mechanism BPF target and scratch ABI contracts
        run: make -C kernel/tools/xdev_ext_mech check-cpu-bpf
      - name: Tool accounting, buffer bounds and SGL profile contracts
        run: |
          python3 kernel/tools/testing/selftests/xdev_ext_mech_tools/xdev_ext_mech_reliable_accounting_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech_tools/xdev_ext_mech_source_drain_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech_tools/xdev_ext_unified_demo_read_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech_tools/xdev_ext_mech_ce_roundtrip_test.py
          python3 kernel/tools/testing/selftests/nvme_xdev_ext_passthru/nvme_sgl_profile_test.py
      - name: Network family exact-cover consumption
        working-directory: .
        run: |
          python3 tests/network/plan_cover/run.py --source-root "$GITHUB_WORKSPACE" --phase shared --output "$RUNNER_TEMP/network-plan-cover"
          python3 tests/network/plan_cover/mutations.py --source-root "$GITHUB_WORKSPACE" --phase shared --output "$RUNNER_TEMP/network-plan-mutants"
      - name: Typed NET and XDomain peer lease ownership
        working-directory: .
        run: |
          python3 tests/network/peer_lease/run.py --source-root "$GITHUB_WORKSPACE" --phase typed --output "$RUNNER_TEMP/network-peer-lease"
          python3 tests/network/peer_lease/mutations.py --source-root "$GITHUB_WORKSPACE" --phase typed --output "$RUNNER_TEMP/network-peer-lease-mutants"
      - name: Socket HOST network member and borrowed frame custody
        working-directory: .
        run: |
          python3 tests/network/host_lease/run.py --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/network-host-consumer"
          python3 tests/network/host_lease/run.py --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/network-host-authority" --suite host
          python3 tests/network/host_lease/run.py --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/network-host-existing-mutants" --check-mutants
          python3 tests/network/host_lease/host_mutants.py --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/network-host-mutants"
      - name: Shared receive ownership and composed library contracts
        working-directory: .
        run: |
          libbpf_archive="$(pkg-config --variable=libdir libbpf)/libbpf.a"
          for scope in rings rx-map-failure receive-options dispatcher socket-identity ownership; do
            python3 tests/network/shared_receive/run.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/shared-receive-$scope" --case "$scope" --scenario all --libbpf-include /usr/include --libbpf-archive "$libbpf_archive"
          done
          python3 tests/network/shared_receive/run_library_integration.py --native-root "$GITHUB_WORKSPACE/build/source-view/kernel" --boundary-root "$GITHUB_WORKSPACE/tests/network/shared_receive" --output "$RUNNER_TEMP/shared-receive-library" --case all --libbpf-include /usr/include --libbpf-archive "$libbpf_archive"
          python3 tests/network/shared_receive_native/build.py --candidate-root "$GITHUB_WORKSPACE" --libbpf-build /usr --libbpf-archive "$(pkg-config --variable=libdir libbpf)/libbpf.a" --output "$RUNNER_TEMP/shared-receive-native-build"
      - name: Thin session library contracts
        run: |
          make -C kernel/tools/testing/selftests/xdev_ext_lib CC="$CC" OUTPUT="$RUNNER_TEMP/xdev-ext-lib-tests" run
          python3 kernel/tools/testing/selftests/xdev_ext_lib/guest/lib_validate_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_lib/guest/iou_procs_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_lib/guest/build_reuse_test.py
          make -C kernel/tools/xdev_ext_mech lib CC="$CC" BUILD_DIR="$RUNNER_TEMP/xdev-ext-lib"
      - name: DMA-BUF peer admission and lifecycle contracts
        working-directory: .
        run: |
          python3 -I tests/core/peer_dmabuf/run.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/dmabuf-admission"
          python3 -I tests/core/peer_dmabuf/importer_run.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/dmabuf-importer"
          make -C tests/core/peer_dmabuf cli-test OUTPUT="$RUNNER_TEMP/dmabuf-native-cli"
      - name: DMA-BUF undescribed import mutants and guest oracle self-test
        working-directory: .
        if: matrix.cc == 'gcc'
        run: |
          python3 -I tests/core/peer_dmabuf/undescribed_mutants.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/dmabuf-undescribed-mutants"
          python3 -I tests/core/peer_dmabuf/undescribed_dma/validate_test.py
      - name: UNKNOWN peer DMA quarantine recovery
        working-directory: .
        if: matrix.cc == 'gcc'
        run: |
          python3 -I tests/core/peer_quarantine/run.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/peer-quarantine"
          python3 -I tests/core/peer_quarantine/mutations.py --source-root "$GITHUB_WORKSPACE"
          python3 -I tests/core/peer_quarantine/native_mutations.py --source-root "$GITHUB_WORKSPACE"
          python3 -I build/source-view/kernel/tools/testing/selftests/xdev_ext_peer/guest/reset_validate_test.py
      - name: Ordinary XSK DATA pool authority and count-journal contracts
        working-directory: .
        if: matrix.cc == 'gcc'
        run: |
          python3 tests/network/pool_dma/run.py --source "$GITHUB_WORKSPACE" --out-root "$RUNNER_TEMP/network-pool-data" --mutations
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          reports = list((Path(os.environ['RUNNER_TEMP']) / 'network-pool-data').glob('pool-dma-*/summary.json'))
          assert len(reports) == 1, reports
          runs = json.loads(reports[0].read_text())['runs']
          assert len(runs) == 12, runs
          assert runs[0]['verdict'] == 'PASS' and runs[0]['candidate_setup'] == 'available', runs[0]
          assert runs[0]['invalid_mapping_verdict'] == 'PASS', runs[0]
          assert all(r['compile_exit'] == 0 and r['verdict'] == 'KILLED' for r in runs[1:]), runs[1:]
          PYCODE
      - name: Zero-copy TX wakeups across link loss and the CREATE queue probe
        working-directory: .
        if: matrix.cc == 'gcc'
        run: python3 -B tests/network/xsk_wakeup/test_zc_wakeup.py -v
      - name: Transmit-only zero-copy callers get XDP mode before CREATE
        working-directory: .
        if: matrix.cc == 'gcc'
        run: python3 -B tests/network/xsk_zc_tx_callers/test_zc_tx_callers.py -v
      - name: COUNT_FIFO public behavior, ownership and mutations
        working-directory: .
        if: matrix.cc == 'gcc'
        run: |
          python3 -B -m unittest discover -s tests/network/count_fifo -p test_typed_fixture.py
          python3 -B -m unittest discover -s tests/network/count_fifo -p test_control_fixture.py
          python3 tests/network/count_fifo/run.py --source "$GITHUB_WORKSPACE" --out-root "$RUNNER_TEMP/count-fifo" --mutations --fixture-contract typed-control-v2
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          reports = list((Path(os.environ['RUNNER_TEMP']) / 'count-fifo').glob('count-*/summary.json'))
          assert len(reports) == 1, reports
          report = reports[0]
          summary = json.loads(report.read_text())
          runs = summary['runs']
          expected = [
              'cpu_derived_dma', 'data_only_sync', 'callback_under_lock',
              'accepted_eagain_retry', 'fifo_head_is_cons', 'accessor_outside_lock',
              'compacted_frame_index', 'checksum_before_prepare', 'rollback_prod_missing',
              'unknown_lease_clear', 'set_only_early_release', 'disconnected_public_consumer',
              'family_peek_no_membership', 'family_unlink_resets_cons', 'family_tail_by_cons',
              'family_overwrite_fatal', 'family_retry_eagain', 'family_wrong_stride',
              'family_rollback_issued', 'set_only_retires', 'stage_dead_under_lock',
              'control_unknown_cleared', 'stop_first_pass_removed', 'reliable_wrong_tag',
          ]
          assert summary['accepted'] is True, summary
          assert summary['structural'] == {'verdict': 'PASS', 'assertions': []}, summary['structural']
          assert summary['expected_mutations'] == expected, summary['expected_mutations']
          assert len(runs) == 25 and [r['label'] for r in runs] == ['baseline'] + expected, runs
          baseline = runs[0]
          assert baseline['compile_exit'] == baseline['exit'] == 0, baseline
          assert baseline['verdict'] == baseline['frozen_golden'] == 'PASS', baseline
          golden = (report.parent / 'baseline/run.stdout').read_bytes()
          assert len(golden) == 83068, len(golden)
          assert summary['fixture_contract'] == 'typed-control-v2', summary['fixture_contract']
          assert hashlib.sha256(golden).hexdigest() == '49ea98459bc391cd8536809bb3957e26e21ccc0c31eabc96e2decdbf21fa47d8'
          semantic = (report.parent / 'baseline/semantic-observed.jsonl').read_bytes()
          assert len(semantic.splitlines()) == 78, len(semantic.splitlines())
          assert hashlib.sha256(semantic).hexdigest() == 'c25cc03a94ad685b5a7d524958aaab65b1dab45f4f1acac081ca3b14de944a47'
          assert baseline['independent_errors'] == [], baseline['independent_errors']
          assert all(r['compile_exit'] == 0 and r['verdict'] == 'KILLED' for r in runs[1:]), runs[1:]
          for r in runs[1:]:
              if r['label'] == 'disconnected_public_consumer':
                  assert r['exit'] == 0 and r['kill_kind'] == 'ownership_wiring', r
                  assert r['structural_mutation']['verdict'] == 'OWNERSHIP_WIRING_RED', r
                  assert r['designated_assertion'] in r['structural_mutation']['assertions'], r
              else:
                  assert r['exit'] in (1, 42) and r['kill_kind'] == 'runtime_assertion', r
                  stderr = (report.parent / r['label'] / 'run.stderr').read_text()
                  assert r['designated_assertion'] in stderr, r
          PYCODE
      - name: Reference-counted lifecycle and CPU transform contracts
        run: python3 kernel/tools/testing/selftests/xdev_ext_mech/refs_suite.py
      - name: CPU class BPF compute callback rules, kfuncs and wiring
        run: python3 kernel/tools/testing/selftests/xdev_ext_mech/compute/run.py
      - name: Mechanism invocation context identity and sleepable prepare
        run: python3 kernel/tools/testing/selftests/xdev_ext_mech/call_identity_test.py
      - name: Per-stage private mechanism instances and report compatibility
        working-directory: .
        run: |
          python3 tests/core/program_instances/registry/run.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/program-registry"
          python3 tests/core/program_instances/session/run.py --output "$RUNNER_TEMP/program-session"
          python3 tests/core/program_instances/session/run.py --suite library --output "$RUNNER_TEMP/program-library"
          python3 tests/core/program_instances/session/selection_run.py --output "$RUNNER_TEMP/program-selection"
          python3 tests/core/program_instances/lifecycle/run.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/program-native-lifetime"
      - name: BPF compute example algorithms and KVM verdict checks
        run: python3 kernel/tools/testing/selftests/xdev_ext_mech/compute_examples/run.py
      - name: Native lifecycle scheduler and teardown contracts
        run: |
          python3 "$GITHUB_WORKSPACE/tests/core/lifecycle/runtime/frame_admission_failure_test.py" --out-dir "$RUNNER_TEMP/frame-admission"
          python3 kernel/tools/testing/selftests/xdev_ext_mech/fanout_scheduler/run.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/fanout_scheduler/produced_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/fanout_scheduler/recycle_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/guest_harness_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/recycle_input_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/fanout_trace_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/fanout_export_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/lifecycle_runtime/fanout_validate_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/teardown_checked/test_ce_unbind.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/provider/unbind_api_test.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/provider/faults/run.py
          python3 kernel/tools/testing/selftests/xdev_ext_mech/provider/stats_frames_test.py
      - name: Stage polling rules, NVMe, DMA provider and AF_XDP contracts
        run: python3 kernel/tools/testing/selftests/xdev_ext_mech/poll/run.py
      - name: Stage poll canonical and artifact receipt qualification
        working-directory: .
        run: python3 -B tests/core/poll/source_setup_test.py --mutations
      - name: Provider scope comparison, ownership and public ABI
        working-directory: .
        run: |
          python3 tests/core/provider_scope/run.py --scope-header "$GITHUB_WORKSPACE/src/core/include/linux/xdev_ext_dma_scope_core.h" --output "$RUNNER_TEMP/provider-scope-comparison"
          python3 tests/core/provider_scope/run_lifecycle.py --source-root "$GITHUB_WORKSPACE" --mode candidate --sanitize --output "$RUNNER_TEMP/provider-scope-lifecycle"
          python3 tests/core/provider_scope/run_abi.py --public-header "$GITHUB_WORKSPACE/src/core/include/linux/xdev_ext_mech.h" --output "$RUNNER_TEMP/provider-scope-abi"
      - name: Shared compute copy runtime and fixed behavior parity
        working-directory: .
        run: |
          python3 tests/compute/family/runtime/run.py --source-root "$GITHUB_WORKSPACE" --phase runtime --output "$RUNNER_TEMP/compute-shared-runtime"
          python3 tests/compute/family/runtime/run.py --source-root "$GITHUB_WORKSPACE" --phase mutations --output "$RUNNER_TEMP/compute-shared-runtime-mutants"
      - name: Typed compute copy windows and admitted plans
        working-directory: .
        run: |
          python3 tests/compute/copy_window/run.py --source-root "$GITHUB_WORKSPACE" --phase typed --output "$RUNNER_TEMP/compute-copy-window"
          python3 tests/compute/copy_window/mutations.py --source-root "$GITHUB_WORKSPACE" --phase typed --output "$RUNNER_TEMP/compute-copy-mutants"
      - name: DMA reference plan byte coverage and provider limits
        working-directory: .
        run: make -C tests/core/provider_dma test BUILD_DIR="$RUNNER_TEMP/dma-reference"
      - name: Native peer DMA observation contracts
        working-directory: .
        run: python3 -I tests/support/evidence/native_trace/test_nvme_peer_dma.py
      - name: Storage family block payload runtime
        working-directory: .
        run: python3 tests/storage/family_block_runtime/run.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/storage-block-runtime" --new
      - name: Native storage member hook and worker contracts
        working-directory: .
        run: python3 tests/storage/native_member_7b/verify.py --source-root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/storage-native-member-7b"
      - name: Native NVMe uring retry and completion ownership
        working-directory: .
        if: matrix.cc == 'gcc'
        run: python3 tests/storage/nvme/uring_lifecycle/run.py --source-root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/nvme-uring-lifecycle" --mutations
      - name: Storage typed windows and descriptor schema
        working-directory: .
        run: bash tests/storage/family_window_schema/run.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/storage-window-schema" new
      - name: Storage LBA window grants and NVMe window handle host contracts
        working-directory: .
        if: matrix.cc == 'gcc'
        run: |
          bash tests/storage/family_window_grant/run.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/storage-window-grant"
          python3 tests/storage/family_window_grant/mutate.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/storage-window-grant-mutants"
          python3 tests/storage/nvme/window_handle/host_window_test.py "$GITHUB_WORKSPACE"
          python3 -I tests/storage/nvme/window_handle/window_validate_test.py
          python3 tests/storage/nvme/window_handle/host_tenant_matrix_test.py "$GITHUB_WORKSPACE"
      - name: Block table mechanism and responsibility facts
        working-directory: .
        run: |
          python3 tools/run.py --cwd tests/storage/nvme/blocktable make check BUILD="$RUNNER_TEMP/blocktable"
          python3 -B tests/tools/test_responsibility.py
          python3 -B tests/tools/test_chain_composition.py
      - name: USER stage rules, scheduler and wiring contracts
        run: |
          python3 kernel/tools/testing/selftests/xdev_ext_mech/user_stage/run.py
          python3 tests/compute/user_stage/test_sharedpool_session.py
          make -C kernel/tools/testing/selftests/xdev_ext_umem run
          make -C kernel/tools/testing/selftests/xdev_ext_mech/user_stage/guest \
            KERNEL_SRC="$PWD/kernel" SHAREDPOOL_LIBXDEV="$RUNNER_TEMP/xdev-ext-lib/lib/libxdev_ext.a" \
            SHAREDPOOL_COMMON="$PWD/tests/eval/common" sharedpool_session_guest
      - name: Socket NIC copy fallback and accounting contracts
        shell: bash
        run: |
          set -euo pipefail
          tests="kernel/tools/testing/selftests/xdev_ext_mech"
          for t in adapter_test independent_credentials rx_adapter_test rx_create_check_test produced_trim_test produced_core_test bpf_both_directions_test nic_accounting_test xsk_tx_copy_accounting_test nic_fallback_choice_test ctl_socket_test rx_core_fifo_test; do
            python3 "$tests/socket_sink/$t.py"
          done
          make -C "$tests/socket_guest" check
      - name: Concurrent frontend workload and evidence checks
        run: python3 kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_concurrency_test.py
      - name: Frontend fork ownership and publication windows
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # These source-extraction tests require this checked-out source tree.
          tests="kernel/tools/testing/selftests/xdev_ext_preload"
          log="$RUNNER_TEMP/xdev-ext-frontend-fork.log"
          timeout 180 python3 "$tests/independent_ordinary_fork_lifetime.py" 2>&1 | tee "$log"
          timeout 60 python3 "$tests/independent_mech_fork_inherited.py" 2>&1 | tee -a "$log"
          timeout 60 python3 "$tests/independent_mech_fork_teardown.py" 2>&1 | tee -a "$log"
          if grep -Eiq '(^not ok([[:space:]]|$)|#[[:space:]]*SKIP([[:space:]]|$)|OK[[:space:]]+\(skipped=|\.\.\. skipped)' "$log"; then
            echo "Frontend fork checks reported failed or skipped cases"
            exit 1
          fi
          test "$(grep -c '^ok [0-9][0-9]* - ' "$log")" -eq 13
          test "$(grep -c '^ok - actual ' "$log")" -eq 2
      - name: Frontend invalid-memory semantics
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/tests/eval/apps/build"
          log="$RUNNER_TEMP/xdev-ext-frontend-invalid-memory.log"
          make -C tests/eval/apps \
            build/libio_uring_unified.so build/libxdev_ext_preload_kernel_model.so
          XDEV_EXT_PRELOAD_TEST_DIR="$output" timeout 300 python3 \
            kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_efault_test.py 2>&1 | tee "$log"
          timeout 300 python3 \
            kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_positional_efault_test.py \
            --build-dir "$output" \
            --results "$RUNNER_TEMP/xdev-ext-positional-fault.json" 2>&1 | tee -a "$log"
          timeout 300 python3 \
            kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_payload_integrity_test.py 2>&1 | tee -a "$log"
          for t in socket_mech_table fallback_report fd_footprint; do
            XDEV_EXT_PRELOAD_TEST_DIR="$output" timeout 300 python3 \
              kernel/tools/testing/selftests/xdev_ext_preload/xdev_ext_preload_${t}_test.py 2>&1 | tee -a "$log"
          done
          if grep -Eiq '^(not ok[[:space:]]|ok[[:space:]].*#[[:space:]]*SKIP|OK[[:space:]]+\(skipped=)|\.\.\. skipped' "$log"; then
            echo "Frontend invalid-memory checks reported failed or skipped cases"
            exit 1
          fi
      - name: Portable comparison workloads and frontend call shapes
        run: |
          make -C tests/eval check
          python3 tests/eval/run.py --suite portable
          make -C tests/eval/apps check
      # SDK-dependent build checks skip explicitly on this SDK-free runner;
      # CLI, refusal and result contracts still run.
      - name: Migrated Redis fragmented response correctness
